server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/event-stream;

    # hash 路由（/#/chat）下所有路径都返回同一个 index.html，
    # 所以这里不需要 try_files 兜底 —— 这也是当初选 hash 模式的原因：
    # 少一条容易配错的重写规则
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # api 是 compose 里的服务名，Docker 内置 DNS 会解析成容器 IP
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 后端按 IP 限流，不透传真实客户端 IP 的话所有请求会共用 nginx 这一个 IP 的配额
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE 三件套。少任何一条，流式回答就会变成"卡很久然后一次性蹦出来"
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}
